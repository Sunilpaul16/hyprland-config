source=~/.config/hypr/hyprlock/colors.conf

background {
    path = ~/.local/state/quickshell/lockscreen-wallpaper
    color = $background_color
    blur_passes = 0
    noise = 0.0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.0
}

# A faint transparent panel over the sharp wallpaper.
shape {
    monitor =
    size = 440, 440
    color = rgba(10151d26)
    rounding = 28
    border_size = 1
    border_color = rgba(ffffff33)
    position = 0, 40
    halign = center
    valign = center
    zindex = 0
}
input-field {
    zindex = 1
    monitor =
    size = 340, 56
    rounding = 16
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = $entry_color
    inner_color = rgba(10151dee)
    font_color = rgb(f5f7fa)
    font_family = $font_family
    placeholder_text = Password
    check_text = Unlocking…
    check_color = $entry_color
    fail_text = Incorrect password
    fail_color = rgb(ff8080)
    capslock_color = rgb(ffcc66)
    # Reveal on the first typed character; hide again when cleared.
    fade_on_empty = true
    fade_timeout = 0

    position = 0, -60
    halign = center
    valign = center
}

label {
    zindex = 1
    monitor =
    text = $LAYOUT
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = 0, -115
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

label { # Clock
    zindex = 1
    monitor =
    text = $TIME
    color = $text_color
    font_size = 65
    font_family = $font_family_clock

    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}
label { # Date
    zindex = 1
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $text_color
    font_size = 17
    font_family = $font_family_clock

    position = 0, 115
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

label { # User
    zindex = 1
    monitor =
    text = $USER
    color = $text_color
    font_size = 20
    font_family = $font_family
    position = 0, 10
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

$lock_cmd = pidof hyprlock || hyprlock

# The listener blocks moved into the shell (quickshell/shell/modules/idle/IdleMonitors.qml), where
# the timeouts are config-driven and live-editable — hypridle has no reload signal, so a settings
# panel writing this file would have to respawn it on every change.
#
# What stays is the logind side, which no idle monitor can do and which nobody tunes: answering
# LockSession (so `loginctl lock-session`, including Session.qml's fallback, actually locks),
# locking before any system sleep, and holding sleep off until the lock is up.
general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
}

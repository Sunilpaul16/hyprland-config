# exec = export SLURP_ARGS='-d -c ADB5C4BB -b 3F475444 -s 00000000'

general {
    col.active_border = rgba(E3E2E539)
    col.inactive_border = rgba(8E919830)
}

misc {
    background_color = rgba(121315FF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(121315FF)
        col.text = rgba(E3E2E5FF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(E3E2E5), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(E3E2E5), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(E3E2E5), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrulev2 = bordercolor rgba(B1C8EAAA) rgba(B1C8EA77),pinned:1
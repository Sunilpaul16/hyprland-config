# Static fuzzel theme — NOT matugen-generated (frozen fallback).
# Fuzzel is only a manual fallback launcher for when quickshell is unavailable,
# so it deliberately does NOT track the live wallpaper palette. These values are
# frozen from the last matugen output (end-4 default blue). Safe to hand-edit;
# switchwall/matugen will not overwrite this file.

[colors]
background=111418ff
text=e1e2e8ff
selection=43474eff
selection-text=c3c6cfff
border=43474edd
match=a1c9fdff
selection-match=a1c9fdff

# matugen config used only by `switchwall --colors-preview`
# Deliberately a single template — hyprland, hyprlock, GTK, btop and kitty apply by writing real config and reloading, so there would be nothing to revert to
# The shell's palette is different: Colors.qml is a mutable QtObject fed by ColorsLoader, so it can be pointed here and back with no side effects

[config]
version_check = false

[templates.quickshell_colors_preview]
input_path = '~/.config/matugen/templates/colors-json/colors.json'
output_path = '~/.cache/matugen/preview-colors.json'

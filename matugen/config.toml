# matugen config for this repo's theming pipeline
# kitty is NOT templated here — matugen's Material You roles can't produce a 16-colour ANSI palette, so colorgen/ handles it from switchwall
# GTK templates need `gsettings color-scheme prefer-dark` (set by switchwall), or GTK4 apps render the light @media block instead

[config]
version_check = false

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock/colors.conf'
output_path = '~/.config/hypr/hyprlock/colors.conf'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/colors.lua'
output_path = '~/.config/hypr/colors.lua'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

# btop/ is a plain copy, not symlinked — this writes to the live ~/.config/btop/, so the repo's btop/themes/ needs a manual sync to match
[templates.btop]
input_path = '~/.config/matugen/templates/btop/matugen.theme'
output_path = '~/.config/btop/themes/matugen.theme'

# Read at runtime by services/ColorsLoader.qml, which mutates Colors.qml in place — templating Colors.qml directly restarted the shell on every wallpaper change
[templates.quickshell_colors_json]
input_path = '~/.config/matugen/templates/colors-json/colors.json'
output_path = '~/.local/state/quickshell/colors.json'

# matugen config — standalone subset of end-4/dots-hyprland's matugen setup.
#
# Only the templates that have zero quickshell dependency are wired up here.
# Skipped for now (add back when quickshell is set up): kde-material-you-colors,
# colors.json (quickshell's own theme feed), wallpaper.txt.
#
# Note: kitty is NOT templated here. Unlike the others, kitty's colors come
# from a separate pipeline (materialyoucolor + sed substitution into
# terminal/kitty-theme.conf, run from ~/.local/bin/switchwall) because it
# needs a real 16-color ANSI terminal palette, which matugen's own Material
# You role set can't produce on its own (see ANALYSIS.md §4 / FEATURES.md
# for why). See colorgen/ next to this file.
#
# GTK templates need `gsettings ... color-scheme prefer-dark` set (done by
# switchwall/this setup) — otherwise GTK4 apps render the @media (light)
# block from gtk-4.0/gtk.css instead of the dark one matugen just generated.

[config]
version_check = false

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock/colors.conf'
output_path = '~/.config/hypr/hyprlock/colors.conf'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/colors.lua'
output_path = '~/.config/hypr/colors.lua'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

# Our own from-scratch quickshell shell (~/.config/quickshell/shell/), NOT
# end-4's ii shell — see [templates.m3colors] below for that, still deferred.
[templates.quickshell_shell_colors]
input_path = '~/.config/matugen/templates/quickshell-shell/Colors.qml'
output_path = '~/.config/quickshell/shell/services/Colors.qml'


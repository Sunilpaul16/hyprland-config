# matugen config for this repo's theming pipeline.
#
# Only templates with zero quickshell dependency are wired up here, plus
# colors.json (loaded at runtime by services/ColorsLoader.qml rather than
# matugen overwriting Colors.qml directly — see that file and Colors.qml's
# own header comment). Skipped for now: kde-material-you-colors,
# wallpaper.txt.
#
# kitty is NOT templated here — its colors come from a separate pipeline
# (materialyoucolor + sed, run from switchwall) since matugen's own Material
# You role set can't produce a 16-color ANSI terminal palette. See colorgen/.
#
# GTK templates need `gsettings color-scheme prefer-dark` set (done by
# switchwall) — otherwise GTK4 apps render the light @media block instead
# of the dark one matugen just generated.

[config]
version_check = false

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock/colors.conf'
output_path = '~/.config/hypr/hyprlock/colors.conf'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/colors.lua'
output_path = '~/.config/hypr/colors.lua'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

# Read at runtime by services/ColorsLoader.qml, which mutates Colors.qml's
# properties in place — NOT a direct template-to-Colors.qml overwrite
# anymore, since that lived inside the hot-reloaded shell tree and
# restarted the whole shell on every wallpaper change.
[templates.quickshell_colors_json]
input_path = '~/.config/matugen/templates/colors-json/colors.json'
output_path = '~/.local/state/quickshell/colors.json'


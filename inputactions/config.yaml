# Media playback and back/forward history navigation in GNOME Files.
touchpad:
  gestures:
    # Tap with four fingers; toggle once after lifting them.
    - type: tap
      fingers: 4
      actions:
        - on: end
          command: playerctl play-pause

    - type: swipe
      fingers: 2
      direction: right
      threshold: 70
      conditions:
        - $window_class == org.gnome.Nautilus
        - $keyboard_modifiers == []
      actions:
        - on: end
          input:
            - keyboard: [leftalt+left]

    - type: swipe
      fingers: 2
      direction: left
      threshold: 70
      conditions:
        - $window_class == org.gnome.Nautilus
        - $keyboard_modifiers == []
      actions:
        - on: end
          input:
            - keyboard: [leftalt+right]
